# Orkestrasi lokal: MySQL + backend Go + frontend (nginx).
# Jalankan: docker compose up --build
# Ganti nilai password & JWT_SECRET sebelum dipakai serius.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: project_pendataan_penduduk
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend_golang
    environment:
      DB_USERNAME: root
      DB_PASSWORD: secret
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: project_pendataan_penduduk
      JWT_SECRET: ganti-dengan-secret-acak-panjang
      FE_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads

  frontend:
    build: ./frontend_vuetify
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
